[package]
# Ported from: Super Factory Manager (SFM) 4.34.0 (TeamDman/SuperFactoryManager,
# MPL-2.0), Minecraft Java 1.21.1 NeoForge. Local-only until the maintainer
# approves publishing; a published port travels under MPL-2.0 with its complete
# source and the original copyright.
name = "horizon-sfm"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MPL-2.0"
description = "Super Factory Manager for Horizon: a Factory Manager that runs SFML programs over its cable network"

[lib]
# This exact source is also injected as a same-crate module by horizon-mixins.
path = "mixins/sfm/runtime.rs"

[workspace]
members = ["tools/audit"]
resolver = "2"
